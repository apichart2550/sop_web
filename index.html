<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT SUPPORT – SOP คู่มือการปฏิบัติงานด้านไอที</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Tailwind CSS (ต้องต่ออินเทอร์เน็ตตอนเปิด) ดู README.txt ถ้าต้องการคอมไพล์เป็นไฟล์ CSS -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Sarabun','TH Sarabun New','THSarabunNew','sans-serif']},colors:{navy:{DEFAULT:'#0b2545',700:'#14438f'}}}}}
try{const t=localStorage.getItem('sop-theme');if(t=='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}
</script>
<style>html{scroll-behavior:smooth;font-size:17px}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.up{animation:up .5s ease both}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">
<header class="sticky top-0 z-30 flex h-[58px] items-center gap-2 bg-navy px-3 text-white sm:gap-3 sm:px-4">
  <button id="mb" class="rounded-lg border border-white/30 px-3 py-1 text-lg lg:hidden" aria-label="เปิดเมนู">☰</button>
  <a href="#home" class="flex items-center gap-2.5 whitespace-nowrap font-bold">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2l13 5v9c0 8-6 13-13 16C10 29 4 24 4 16V7z" fill="#2f7be6"/><rect x="10" y="10" width="14" height="9" rx="1.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M13 23h8" stroke="#8fd0ff" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="hidden min-[420px]:block">IT SUPPORT<small class="hidden text-[11px] font-normal leading-none text-sky-300 sm:block">SOP คู่มือการปฏิบัติงาน</small></span>
  </a>
  <div class="relative ml-auto min-w-0 max-w-[360px] flex-1">
    <input id="q" type="search" autocomplete="off" placeholder="ค้นหา SOP เช่น กล้อง, เครื่องพิมพ์, Wi-Fi" aria-label="ค้นหา SOP" class="w-full rounded-full bg-white/15 px-4 py-2 text-sm text-white placeholder-sky-200/70 outline-none focus:ring-2 focus:ring-sky-300">
    <div id="res" class="absolute right-0 top-11 hidden max-h-[60vh] w-[min(440px,92vw)] max-sm:fixed max-sm:inset-x-3 max-sm:top-[62px] max-sm:w-auto overflow-auto rounded-2xl border border-slate-200 bg-white text-slate-800 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"></div>
  </div>
  <button id="th" class="grid h-[38px] w-[38px] flex-none place-items-center rounded-full border border-white/30 bg-white/10 text-lg hover:bg-white/20" aria-label="สลับโหมดมืด/สว่าง"></button>
</header>
<div id="ov" class="fixed inset-0 z-10 hidden bg-black/50 lg:hidden"></div>
<div class="grid min-w-0 grid-cols-1 lg:grid-cols-[290px_minmax(0,1fr)]">
  <aside id="sd" class="fixed bottom-0 left-0 top-[58px] z-20 w-[85vw] max-w-72 -translate-x-full overflow-y-auto border-r border-slate-200 bg-white p-4 transition-transform lg:sticky lg:h-[calc(100vh-58px)] lg:w-auto lg:translate-x-0 dark:border-slate-800 dark:bg-slate-900"><nav id="nav"></nav></aside>
  <main id="m" class="min-w-0 w-full p-4 sm:p-6 lg:p-8"></main>
</div>
<button id="top" class="fixed bottom-5 right-5 z-20 hidden h-11 w-11 rounded-full bg-blue-600 text-xl text-white shadow-lg" aria-label="กลับไปด้านบน">↑</button>
<script src="manuals/index.js"></script>
<script src="manuals/sop-01.js"></script>
<script src="manuals/sop-02.js"></script>
